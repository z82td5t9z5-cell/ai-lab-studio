<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI実験室 Studio</title><style>body{font-family:sans-serif;background:#101827;color:white;padding:16px}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#24334a;color:white;border:1px solid #62758f;border-radius:8px}button{padding:13px;margin:5px;background:#5ad4ef;border:0;border-radius:8px;font-weight:bold}canvas{width:100%;background:#17243a;border-radius:12px}#status{padding:12px}</style></head><body><h2>AI実験室 Studio</h2><p>iPhone対応・無料動画制作ツール</p><input id="title" value="AIだけで動画を作ってみた"><textarea id="script" rows="7">AI実験室へようこそ！
今回はAIで動画を作ります。
台本を入力するだけで画面を生成します。
完成した動画を確認しましょう。</textarea><button onclick="make()">① 生成</button><button onclick="play()">② 再生</button><button onclick="speak()">③ 読み上げ</button><button onclick="stop()">停止</button><p id="status">準備完了</p><canvas id="cv" width="960" height="540"></canvas><script>let scenes=[],i=0,timer;const c=document.getElementById("cv"),x=c.getContext("2d"),s=document.getElementById("status");function draw(){x.fillStyle="#142b49";x.fillRect(0,0,960,540);x.fillStyle="#61ddf5";x.textAlign="center";x.font="bold 36px sans-serif";x.fillText("AI実験室 STUDIO",480,85);x.fillStyle="white";x.font="bold 43px sans-serif";let t=scenes[i]||"生成ボタンを押してください";for(let j=0;j<t.length;j+=18)x.fillText(t.slice(j,j+18),480,245+Math.floor(j/18)*60,880);x.font="25px sans-serif";x.fillText(document.getElementById("title").value,480,455)}function stop(){clearInterval(timer);if(window.speechSynthesis)speechSynthesis.cancel();s.textContent="停止しました"}function make(){clearInterval(timer);scenes=document.getElementById("script").value.split(/\n/).filter(Boolean);i=0;draw();s.textContent=scenes.length+"場面を生成しました"}function play(){if(!scenes.length)make();clearInterval(timer);i=0;draw();s.textContent="再生中";timer=setInterval(()=>{i++;if(i>=scenes.length){clearInterval(timer);s.textContent="再生完了";return}draw()},4000)}function speak(){if(!scenes.length)make();if(!window.speechSynthesis){s.textContent="読み上げ非対応";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(scenes.join("。"));u.lang="ja-JP";speechSynthesis.speak(u);s.textContent="読み上げ中"}draw();</script></body></html>
